server:
  port: 8081

spring:
  neo4j:
    uri: ${SPRING_NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${SPRING_NEO4J_AUTHENTICATION_USERNAME:neo4j}
      password: ${SPRING_NEO4J_AUTHENTICATION_PASSWORD:fraudgraph}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/frauddecisions}
    username: ${SPRING_DATASOURCE_USERNAME:frauddecisions}
    password: ${SPRING_DATASOURCE_PASSWORD:frauddecisions}
  jpa:
    hibernate:
      ddl-auto: update
