<main class="auth-card">
  <h2>Sign in</h2>

  @if (notice()) {
    <p class="notice">{{ notice() }}</p>
  }

  <form (submit)="$event.preventDefault(); submit(username.value, password.value)">
    <label>
      Username
      <input #username name="username" type="text" autocomplete="username" autofocus />
    </label>
    <label>
      Password
      <input #password name="password" type="password" autocomplete="current-password" />
    </label>

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</main>
